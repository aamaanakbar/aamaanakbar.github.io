<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akbar Ali</title>
<meta name="description" content="Akbar Ali, PhD Scholar at IIT Gandhinagar. Computer Vision, Generative Models, Hyperspectral Imaging.">
<link rel="icon" href="files/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #b8d8e8;
  padding: 40px 20px;
}

.outer {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 680px;
  width: 100%;
}

/* Photo and name sitt on the blue background, above the card */
.profile-photo {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  border: 3px solid #fff;
  box-shadow: 0 2px 16px rgba(0,0,0,.14);
  display: block;
  margin-bottom: 14px;
}

.name {
  font-family: 'Lora', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 600;
  color: #1a1a1a;
  letter-spacing: -.01em;
  text-align: center;
  margin-bottom: 22px;
}

/* White card only for bio + links */
.card {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 4px 32px rgba(0,0,0,.10);
  padding: 30px 48px 32px;
  width: 100%;
  text-align: left;
}

.bio {
  font-size: .93rem;
  line-height: 1.78;
  color: #3a3a3a;
  margin-bottom: 20px;
}

.bio a {
  color: #2d6fa4;
  text-decoration: none;
}
.bio a:hover { text-decoration: underline; }

.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.link-row {
  display: flex;
  align-items: center;
  font-size: .88rem;
  color: #2d6fa4;
  text-decoration: none;
  font-weight: 500;
  transition: color .15s;
}
.link-row:hover { color: #1a4f7a; text-decoration: underline; }

.btn-brief {
  display: inline-block;
  margin-top: 4px;
  padding: 9px 22px;
  background: #2d6fa4;
  color: #fff;
  border-radius: 7px;
  font-size: .88rem;
  font-weight: 500;
  text-decoration: none;
  transition: background .15s, transform .12s;
  width: fit-content;
}
.btn-brief:hover {
  background: #1a4f7a;
  text-decoration: none;
  transform: translateY(-1px);
}

@media (max-width: 520px) {
  .card { padding: 24px 20px 22px; }
  .name { font-size: 1.35rem; }
}
</style>
</head>
<body>

<div class="outer">
  <img class="profile-photo" src="files/aamaan1.png" alt="Akbar Ali">
  <div class="name">Akbar Ali</div>

  <div class="card">
    <p class="bio">
      I am a Ph.D. researcher in Computer Science and Engineering at
      <a href="https://iitgn.ac.in/" target="_blank" rel="noopener">IIT Gandhinagar</a>,
      working with
      <a href="https://iitgn.ac.in/faculty/cse/shanmuganathan" target="_blank" rel="noopener">Prof. Shanmuganathan Raman</a>.
      My research focuses on computer vision, generative models, image restoration, and hyperspectral imaging.
    </p>

    <div class="links">
      <a class="link-row" href="mailto:akbar.ali@iitgn.ac.in">akbar.ali@iitgn.ac.in</a>
      <a class="btn-brief" href="home.html">Brief Info</a>
    </div>
  </div>
</div>

</body>
</html>
